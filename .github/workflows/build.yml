name: build
on:
  push:
#    branches-ignore:
#      - 'dependabot/**' #avoid duplicates: only run the PR, not the commit
#      - 'gh-pages' #github pages do not trigger all tests
#    tags-ignore:
#      - 'v*' #avoid rerun existing commit on release
#  pull_request:
#    branches:
#      - 'main'
jobs:
  build:
    runs-on: ubuntu-latest
    #if: ${{ false }}  # disable for now
    permissions:
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history required for SonarCloud blame data

      - name: Select Java Version
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Run SUT unit tests
        run: |
          set +e  # keep running every project even if one fails, so the summary covers all of them
          PROJECTS=(
            "EventBus.Tests|sut/src/BuildingBlocks/EventBus/EventBus.Tests/EventBus.Tests.csproj"
            "Basket.UnitTests|sut/src/Services/Basket/Basket.UnitTests/Basket.UnitTests.csproj"
            "Catalog.UnitTests|sut/src/Services/Catalog/Catalog.UnitTests/Catalog.UnitTests.csproj"
            "Ordering.UnitTests|sut/src/Services/Ordering/Ordering.UnitTests/Ordering.UnitTests.csproj"
          )

          {
            echo "## SUT unit test results"
            echo
            echo "| Project | Result | Passed | Failed | Skipped | Total | Duration |"
            echo "|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          OVERALL_EXIT=0
          for entry in "${PROJECTS[@]}"; do
            NAME="${entry%%|*}"
            CSPROJ="${entry#*|}"

            OUTPUT=$(dotnet test "$CSPROJ" 2>&1)
            EXIT_CODE=$?
            echo "$OUTPUT"

            SUMMARY_LINE=$(echo "$OUTPUT" | grep -E "^(Passed|Failed)!" | tail -1)
            if [ -n "$SUMMARY_LINE" ]; then
              RESULT=$(echo "$SUMMARY_LINE" | grep -oE "^(Passed|Failed)")
              PASSED=$(echo "$SUMMARY_LINE" | grep -oE "Passed:[[:space:]]*[0-9]+" | grep -oE "[0-9]+")
              FAILED=$(echo "$SUMMARY_LINE" | grep -oE "Failed:[[:space:]]*[0-9]+" | grep -oE "[0-9]+")
              SKIPPED=$(echo "$SUMMARY_LINE" | grep -oE "Skipped:[[:space:]]*[0-9]+" | grep -oE "[0-9]+")
              TOTAL=$(echo "$SUMMARY_LINE" | grep -oE "Total:[[:space:]]*[0-9]+" | grep -oE "[0-9]+")
              DURATION=$(echo "$SUMMARY_LINE" | grep -oE "Duration:[[:space:]]*[^-]+" | sed -E 's/Duration:[[:space:]]*//; s/[[:space:]]+$//')
              ICON="✅"
              [ "$RESULT" = "Failed" ] && ICON="❌"
              echo "| $NAME | $ICON $RESULT | $PASSED | $FAILED | $SKIPPED | $TOTAL | $DURATION |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $NAME | ⚠️ build/crash (see log) | - | - | - | - | - |" >> "$GITHUB_STEP_SUMMARY"
            fi

            [ "$EXIT_CODE" -ne 0 ] && OVERALL_EXIT=1
          done

          exit $OVERALL_EXIT

      - name: Init jenkins commit status (optional)
        run: |
          curl -L -X POST  https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
             -H "Accept: application/vnd.github+json" \
             -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
             -H "X-GitHub-Api-Version: 2022-11-28" \
             -d "{\"state\":\"pending\", \"context\":\"Jenkins CI\"}"

      - name: Build only, tests run in on-premises Jenkins
        run: mvn test -DskipTests -U --no-transfer-progress
  sonarqube:
    needs: [ build ]
    #if: ${{ false }}  # disable for now
    #This job fails when comming from a dependabot PR (can't read the sonarqube token for security reasons).
    #Links to discussions and workaround at: https://github.com/giis-uniovi/samples-giis-template/issues/4
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      # ── SonarCloud analysis (SUT only — scoped to ./sut via sonar.projectBaseDir) ─
      # C# requires dotnet-sonarscanner (begin → build → end) so that Roslyn
      # analyzers are invoked during the build. C# + TypeScript (WebSPA) are the
      # only languages analyzed; settings come from sonar.properties.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history required for SonarCloud blame data

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarCloud begin  (C# instrumentation — must precede dotnet build)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Load sonar.properties as /d: flags. The token is read from the
          # SONAR_TOKEN env var by the scanner (never expanded into this script).
          # NOTE: the file is NOT named sonar-project.properties on purpose — the
          # SonarScanner for .NET rejects a file with that reserved name in the repo.
          # projectKey/projectName/organization use dedicated flags per v11 requirements.
          PROPS=()
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line%$'\r'}"                      # strip CR if file is CRLF
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line// }" ]] && continue
            PROPS+=("/d:$line")
          done < sonar.properties
          dotnet sonarscanner begin \
            /k:"my:retorch-st-eShopContainers" \
            /n:"retorch-st-eShopContainers" \
            /o:"giis" \
            /d:sonar.projectBaseDir="$GITHUB_WORKSPACE/sut" \
            "${PROPS[@]}"

      - name: Restore SUT NuGet packages
        run: dotnet restore sut/src/eShopOnContainers-ServicesAndWebApps.sln

      - name: Build SUT (.NET)
        run: dotnet build sut/src/eShopOnContainers-ServicesAndWebApps.sln --no-restore

      - name: SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end

      - name: Check SonarCloud quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: .sonarqube/out/.sonar/report-task.txt
